spring.application.name=api-service
server.port=${SERVER_PORT:8080}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/alpha_stream}
spring.datasource.username=${POSTGRES_USER:alpha}
spring.datasource.password=${POSTGRES_PASSWORD:alpha}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
