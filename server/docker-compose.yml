services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8088:8088"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-service
      - realtime-service

  api-service:
    build:
      context: .
      dockerfile: module-api/Dockerfile
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/alpha_stream
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: alpha
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - postgres

  matching-service:
    build:
      context: .
      dockerfile: module-matching/Dockerfile
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - redis

  realtime-service:
    build:
      context: .
      dockerfile: module-realtime/Dockerfile
    environment:
      SERVER_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - redis

  batch-service:
    build:
      context: .
      dockerfile: module-batch/Dockerfile
    environment:
      SERVER_PORT: 8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/alpha_stream
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: alpha
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres
      - clickhouse

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alpha_stream
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: alpha
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: alpha_stream
      CLICKHOUSE_USER: alpha
      CLICKHOUSE_PASSWORD: alpha
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  postgres-data:
  clickhouse-data:
